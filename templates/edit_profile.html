<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .edit-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="edit-container">

        <h1>Edit Profile</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label>Name</label>
                <input
                    type="text"
                    name="name"
                    value="{{ request.user.name }}"
                    required
                > 
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    value="{{ request.user.email }}"
                    disabled
                >
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input
                    type="text"
                    name="phone"
                    value="{{ profile.phone }}"
                >
            </div>

            <div class="form-group">
                <label>City</label>
                <input
                    type="text"
                    name="city"
                    value="{{ profile.city }}"
                >
            </div>

            <button type="submit" class="btn">
                Save Changes
            </button>

        </form>

        <a class="back-link" href="{% url 'profile' %}">
            Back to Profile
        </a>

    </div>

</body>
</html>
