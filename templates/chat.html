
<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 90vh;
            margin: 5vh auto;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background: #222;
            color: white;
            text-align: center;
        }

        .chat-header h2 {
            margin: 0;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            margin-bottom: 15px;
            border-radius: 10px;
            line-height: 1.5;
        }

        .user-message {
            margin-left: auto;
            background: #e8e8e8;
            text-align: right;
        }

        .ai-message {
            margin-right: auto;
            background: #f1f1f1;
        }

        .message-input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .send-button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .send-button:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="chat-header">
            <h2>AI Chatbot</h2>
        </div>

        <div class="chat-messages">

            <div class="message ai-message">
                Hello! How can I help you?
            </div>

        </div>

        <form class="message-input-area">

            <input
                type="text"
                class="message-input"
                placeholder="Ask something..."
                required
            >

            <button type="submit" class="send-button">
                Send
            </button>

        </form>

    </div>

</body>
</html>
