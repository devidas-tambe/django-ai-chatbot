<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }


        /* ==============================
           DASHBOARD
        ============================== */

        .dashboard {
            display: flex;
            min-height: 100vh;
        }


        /* ==============================
           MAIN AREA
        ============================== */

        .main-content {
            flex: 1;
            padding: 30px;
            height: 100vh;
            overflow: hidden;
        }


        /* ==============================
           WELCOME
        ============================== */

        .welcome {
            margin-bottom: 20px;
        }

        .welcome h1 {
            margin: 0 0 8px 0;
        }

        .welcome p {
            color: #555;
        }


        /* ==============================
           CHAT CONTAINER
        ============================== */

        .chat-container {
            width: 100%;
            height: calc(100vh - 150px);
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }


        /* ==============================
           CHAT HEADER
        ============================== */

        .chat-header {
            padding: 20px;
            background: #222;
            color: white;
            text-align: center;
        }

        .chat-header h2 {
            margin: 0;
        }


        /* ==============================
           CHAT MESSAGES
        ============================== */

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }


        /* ==============================
           COMMON MESSAGE
        ============================== */

        .message {
            max-width: 70%;
            padding: 12px 16px;
            margin-bottom: 15px;
            border-radius: 10px;
            line-height: 1.6;
            word-wrap: break-word;
        }


        /* ==============================
           AI MESSAGE
        ============================== */

        .ai-message {
            margin-right: auto;
            background: #f1f1f1;
            color: #222;
        }


        /* ==============================
           USER MESSAGE
        ============================== */

        .user-message {
            margin-left: auto;
            background: #e8e8e8;
            text-align: right;
            color: #222;
        }


        /* ==============================
           AI HEADINGS
        ============================== */

        .ai-message h1 {
            font-size: 28px;
            margin: 5px 0 18px 0;
            line-height: 1.3;
        }

        .ai-message h2 {
            font-size: 23px;
            margin: 22px 0 12px 0;
            line-height: 1.35;
        }

        .ai-message h3 {
            font-size: 20px;
            margin: 18px 0 10px 0;
            line-height: 1.4;
        }

        .ai-message h4 {
            font-size: 18px;
            margin: 15px 0 8px 0;
        }


        /* ==============================
           AI BOLD TEXT
        ============================== */

        .ai-message strong {
            font-weight: 700;
        }


        /* ==============================
           AI PARAGRAPH
        ============================== */

        .ai-message p {
            margin: 8px 0 12px 0;
        }


        /* ==============================
           AI LISTS
        ============================== */

        .ai-message ul,
        .ai-message ol {
            margin: 10px 0 15px 0;
            padding-left: 28px;
        }

        .ai-message li {
            margin-bottom: 8px;
        }


        /* ==============================
           AI LINKS
        ============================== */

        .ai-message a {
            color: #0066cc;
            text-decoration: underline;
        }


        /* ==============================
           INLINE CODE
        ============================== */

        .ai-message code {
            background: #e2e2e2;
            padding: 3px 7px;
            border-radius: 5px;
            font-family: Consolas, monospace;
            font-size: 14px;
        }


        /* ==============================
           CODE BLOCK
        ============================== */

        .ai-message pre {
            background: #1e1e1e;
            color: #ffffff;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
            line-height: 1.5;
        }

        .ai-message pre code {
            background: transparent;
            padding: 0;
            color: inherit;
            font-size: 14px;
        }


        /* ==============================
           BLOCKQUOTE
        ============================== */

        .ai-message blockquote {
            margin: 15px 0;
            padding: 10px 15px;
            border-left: 4px solid #888;
            background: #e8e8e8;
            color: #555;
        }


        /* ==============================
           HORIZONTAL LINE
        ============================== */

        .ai-message hr {
            border: none;
            border-top: 1px solid #ccc;
            margin: 20px 0;
        }


        /* ==============================
           AI TABLE
        ============================== */

        .ai-message table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            background: white;
        }

        .ai-message th,
        .ai-message td {
            border: 1px solid #ccc;
            padding: 9px 12px;
            text-align: left;
        }

        .ai-message th {
            font-weight: 700;
            background: #e8e8e8;
        }


        /* ==============================
           MESSAGE INPUT
        ============================== */

        .message-input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        .message-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }


        /* ==============================
           SEND BUTTON
        ============================== */

        .send-button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        .send-button:hover {
            opacity: 0.8;
        }


        /* ==============================
           AI TYPING
        ============================== */

        .typing-message {
            margin-right: auto;
            background: #f1f1f1;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
            width: fit-content;
        }

        .typing-text {
            font-size: 14px;
            color: #666;
            margin-right: 5px;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: #777;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        .typing-dot:nth-child(4) {
            animation-delay: 0.6s;
        }


        /* ==============================
           TYPING ANIMATION
        ============================== */

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            30% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 768px) {

            .main-content {
                padding: 15px;
            }

            .message {
                max-width: 90%;
            }

            .ai-message h1 {
                font-size: 24px;
            }

            .ai-message h2 {
                font-size: 21px;
            }

            .ai-message h3 {
                font-size: 18px;
            }

            .message-input-area {
                padding: 10px;
            }

            .send-button {
                padding: 12px 15px;
            }
        }

    </style>


    <!-- Markdown Renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

</head>

<body>

<div class="dashboard">

    <!-- Navbar -->
    {% include "navbar.html" %}


    <!-- Main Content -->
    <div class="main-content">

        <div class="welcome">
            <h1>Welcome, {{ request.user.name }} 👋</h1>
        </div>


        <!-- Chat Interface -->
        <div class="chat-container">

            <div class="chat-header">
                <h2>AI Chatbot 🤖</h2>
            </div>


            <div class="chat-messages">

                <div class="message ai-message">
                    Hello! How can I help you?
                </div>

                {% for chat in chat_messages %}

                    <div class="message user-message">
                        {{ chat.message }}
                    </div>

                    {% if chat.response %}
                        <div class="message ai-message saved-ai-response">
                            {{ chat.response }}
                        </div>
                    {% endif %}

                {% endfor %}

            </div>


            <form id="chatForm"
                  class="message-input-area"
                  method="POST"
                  action="{% url 'chat' %}">

                {% csrf_token %}

                {% if conversation %}
                    <input
                        type="hidden"
                        name="conversation_id"
                        value="{{ conversation.id }}"
                    >
                {% endif %}

                <input
                    id="messageInput"
                    type="text"
                    name="message"
                    class="message-input"
                    placeholder="Ask something..."
                    required
                >

                <button type="submit" class="send-button">
                    Send
                </button>

            </form>

        </div>

    </div>

</div>
<script>

    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const messages = document.querySelector(".chat-messages");

    const conversationId = "{{ conversation.id }}";


    // ==========================================
    // SCROLL CHAT TO BOTTOM
    // ==========================================

    function scrollToBottom() {

        messages.scrollTop =
            messages.scrollHeight;

    }


    // ==========================================
    // FORMAT SAVED AI RESPONSES
    // ==========================================

    function formatSavedAIResponses() {

        const savedResponses =
            document.querySelectorAll(
                ".saved-ai-response"
            );


        savedResponses.forEach(function (message) {

            const markdownText =
                message.textContent;


            if (
                typeof marked !== "undefined" &&
                markdownText.trim()
            ) {

                message.innerHTML =
                    marked.parse(markdownText);

            }

        });

    }


    // ==========================================
    // PAGE LOAD
    // ==========================================

    window.addEventListener(
        "load",
        function () {

            // Format previous AI responses
            formatSavedAIResponses();

            // Scroll chat to bottom
            scrollToBottom();

        }
    );


    // ==========================================
    // SEND MESSAGE
    // ==========================================

    form.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            // ==================================
            // GET USER MESSAGE
            // ==================================

            const message =
                input.value.trim();


            if (!message) {
                return;
            }


            // ==================================
            // SHOW USER MESSAGE
            // ==================================

            const userMessage =
                document.createElement("div");


            userMessage.className =
                "message user-message";


            userMessage.textContent =
                message;


            messages.appendChild(
                userMessage
            );


            // Clear input
            input.value = "";


            // Scroll down
            scrollToBottom();


            // ==================================
            // SHOW AI TYPING
            // ==================================

            const typingMessage =
                document.createElement("div");


            typingMessage.className =
                "typing-message";


            typingMessage.innerHTML = `
                <span class="typing-text">
                    AI is typing
                </span>

                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
                <span class="typing-dot"></span>
            `;


            messages.appendChild(
                typingMessage
            );


            scrollToBottom();


            // ==================================
            // CREATE FORM DATA
            // ==================================

            const formData =
                new FormData();


            formData.append(
                "message",
                message
            );


            formData.append(
                "conversation_id",
                conversationId
            );


            // CSRF TOKEN
            const csrfToken =
                document.querySelector(
                    "[name=csrfmiddlewaretoken]"
                ).value;


            formData.append(
                "csrfmiddlewaretoken",
                csrfToken
            );


            // ==================================
            // SEND REQUEST TO DJANGO
            // ==================================

            try {

                const response =
                    await fetch(
                        form.action,
                        {
                            method: "POST",

                            body: formData,

                            headers: {
                                "X-Requested-With":
                                    "XMLHttpRequest"
                            }
                        }
                    );


                // ==================================
                // CHECK SERVER STATUS
                // ==================================

                if (!response.ok) {

                    throw new Error(
                        "Server Error: " +
                        response.status
                    );

                }


                // ==================================
                // GET JSON RESPONSE
                // ==================================

                const data =
                    await response.json();


                console.log(
                    "Django JSON response:",
                    data
                );


                // ==================================
                // REMOVE TYPING
                // ==================================

                typingMessage.remove();


                // ==================================
                // AI RESPONSE
                // ==================================

                if (data.success) {


                    const aiMessage =
                        document.createElement(
                            "div"
                        );


                    aiMessage.className =
                        "message ai-message";


                    // ==================================
                    // MARKDOWN → HTML
                    // ==================================

                    if (
                        typeof marked !==
                        "undefined"
                    ) {

                        aiMessage.innerHTML =
                            marked.parse(
                                data.response
                            );

                    } else {

                        // Fallback
                        aiMessage.textContent =
                            data.response;

                    }


                    // Add AI message
                    messages.appendChild(
                        aiMessage
                    );


                    // Scroll
                    scrollToBottom();


                } else {


                    // ==================================
                    // AI ERROR
                    // ==================================

                    const aiError =
                        document.createElement(
                            "div"
                        );


                    aiError.className =
                        "message ai-message";


                    aiError.textContent =
                        data.error ||
                        "AI response NOT available.";


                    messages.appendChild(
                        aiError
                    );


                    scrollToBottom();

                }


            } catch (error) {


                // ==================================
                // ERROR HANDLING
                // ==================================

                console.error(
                    "CHAT ERROR:",
                    error
                );


                // Remove typing
                typingMessage.remove();


                // Create error message
                const errorMessage =
                    document.createElement(
                        "div"
                    );


                errorMessage.className =
                    "message ai-message";


                errorMessage.textContent =
                    "Error: " +
                    error.message;


                messages.appendChild(
                    errorMessage
                );


                scrollToBottom();

            }

        }
    );

</script>
</body>
</html>
